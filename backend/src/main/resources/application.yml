spring:
  application:
    name: opendepo

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OPEN_DEPO_OIDC_ISSUER_URI:http://localhost:8180/realms/opendepo}

  datasource:
    url: ${OPEN_DEPO_DB_URL:jdbc:postgresql://localhost:5433/opendepo}
    username: ${OPEN_DEPO_DB_USERNAME:opendepo}
    password: ${OPEN_DEPO_DB_PASSWORD:opendepo}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

opendepo:
  web:
    allowed-origins: ${OPEN_DEPO_WEB_ALLOWED_ORIGINS:http://localhost:3000}
